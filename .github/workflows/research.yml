name: research

# Morning research for the daily editorial session (05:17 KST, or on request):
# collect the registry's feeds, read permitted article pages (robots.txt,
# opt-outs and paywalls respected) and commit a public research pack with
# minimal information only: titles, URLs, outlets, times, access status,
# figures and one short opening sentence per read source (pipeline/src/preview/pack.ts).
# No article text or long excerpts reach the repository or the logs.
on:
  schedule:
    - cron: '17 20 * * *'   # 05:17 KST
    - cron: '41 20 * * *'   # 05:41 KST, in case the first is delayed or skipped
  push:
    branches: [main]
    paths: ['research-packs/request-*']   # the editorial session can ask for a pack
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
        working-directory: pipeline
      - run: npm ci
        working-directory: web
      - name: Skip when today's pack exists
        id: have
        run: D=$(TZ=Asia/Seoul date +%F); [ -f "research-packs/$D.json" ] && echo "skip=true" >> "$GITHUB_OUTPUT" || echo "skip=false" >> "$GITHUB_OUTPUT"
      - name: Collect and read
        if: steps.have.outputs.skip != 'true'
        working-directory: pipeline
        env:
          ALLOW_PUBLIC_PREVIEW: '1'
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: npx tsx src/cli/preview.ts --out-dir "$RUNNER_TEMP/research" --pool 60 --per-story 3 > /dev/null 2> "$RUNNER_TEMP/err.txt" || { echo "preview failed (details withheld from public logs)"; exit 1; }
      - name: Write the public pack and commit
        if: steps.have.outputs.skip != 'true'
        run: |
          D=$(TZ=Asia/Seoul date +%F)
          (cd pipeline && npx tsx src/cli/research-pack.ts "$RUNNER_TEMP/research/preview.json" "../research-packs/$D.json" --date "$D")
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add "research-packs/$D.json"
          git commit -m "research: $D [skip ci]"
          for i in 1 2 3; do git push && break || git pull --rebase; done
